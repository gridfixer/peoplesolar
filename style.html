<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

  /* ==========================================
     1. ตัวแปรสีและค่าพื้นฐาน (Variables & Reset)
     ========================================== */
  :root {
    --primary: #7c3aed;          /* ม่วงหลัก */
    --primary-hover: #6d28d9;    /* ม่วงเข้มเมื่อชี้/กด */
    --primary-light: #f5f3ff;    /* ม่วงอ่อนพื้นหลัง */
    --primary-border: #ddd6fe;   /* ม่วงเส้นขอบ */
    --bg-page: #ede9fe;          /* พื้นหลังเว็บโทนม่วงอ่อน */
    --bg-card: #ffffff;          /* พื้นหลังกล่อง */
    --text-main: #1e293b;        /* สีตัวอักษรหลัก */
    --text-muted: #475569;       /* ปรับสีตัวอักษรรองให้เข้มขึ้นนิดหน่อยเพื่อให้อ่านง่ายขึ้น */
    --radius-lg: 16px;           /* ความโค้งกล่องหลัก */
    --radius-md: 8px;            /* ความโค้งปุ่มและช่องกรอก */
    --shadow-card: 0 4px 20px -2px rgba(124, 58, 237, 0.08);
  }

  /* ขยายขนาดตัวอักษรพื้นฐานทั้งเว็บให้ใหญ่ขึ้น (จากปกติ 16px เป็น 18px) */
  html {
    font-size: 18px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Prompt', sans-serif;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    padding: 16px;
    line-height: 1.55;
  }

  /* ==========================================
     2. เลย์เอาต์หลักและระบบ Responsive Grid (PC vs Mobile)
     ========================================== */
  .app-container {
    max-width: 1024px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* กำหนดระยะห่างระหว่างกล่อง 1, 2, 3 และ 4, 5, 6 ให้มีผลทั้งบนมือถือและ PC */
  .col-left,
  .col-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* โครงสร้างสำหรับหน้าจอ PC (กว้าง 900px ขึ้นไป) แบ่งเป็น 2 คอลัมน์ซ้าย-ขวา */
  @media (min-width: 900px) {
    .app-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "header header"
        "col-left col-right"
        "footer footer";
      column-gap: 18px;
      row-gap: 18px;
      align-items: start;
    }
    .grid-header { grid-area: header; }
    .col-left    { grid-area: col-left; }
    .col-right   { grid-area: col-right; }
    .grid-footer { grid-area: footer; }
  }

  /* ==========================================
     3. กล่องข้อมูล (Cards & Headers)
     ========================================== */
  .card-box {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(124, 58, 237, 0.1);
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .badge-step {
    background: var(--primary);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-main);
  }

  /* ==========================================
     4. ช่องกรอกตัวเลขและแถบเลื่อน (Inputs & Sliders)
     ========================================== */
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--primary-light);
    border: 2px solid var(--primary-border);
    border-radius: var(--radius-md);
    padding: 10px 16px;
    transition: all 0.2s ease;
    margin-bottom: 16px;
  }

  .input-wrapper:focus-within {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }

  .currency-prefix {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--primary);
    margin-right: 8px;
  }

  .number-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--primary);
    outline: none;
  }

  .slider-container {
    margin-bottom: 18px;
  }

  input[type="range"].purple-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 10px;
    background: var(--primary-border);
    border-radius: 99px;
    outline: none;
  }

  input[type="range"].purple-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(124, 58, 237, 0.4);
    transition: transform 0.15s ease;
  }

  input[type="range"].purple-slider::-webkit-slider-thumb:active {
    transform: scale(1.15);
  }

  /* ==========================================
     5. ปุ่มกดและตัวเลือก (Buttons & Dropdowns)
     ========================================== */
  .quick-select-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill-btn {
    background: #fff;
    border: 1.5px solid var(--primary-border);
    color: var(--text-main);
    padding: 10px 12px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1 1 auto;
    text-align: center;
  }

  .pill-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .pill-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
  }

  .equal-width-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .custom-select {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--primary-border);
    color: var(--text-main);
    padding: 10px 12px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
    height: 100%;
  }

  .custom-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }

  /* ==========================================
     6. โครงสร้างเลย์เอาต์ย่อยและข้อความ
     ========================================== */
  .bill-unit-result {
    margin-top: 14px;
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 500;
    text-align: left;
  }
  .bill-unit-result span {
    color: var(--primary);
    font-weight: 700;
  }

  .time-split-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .time-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .time-label-top {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .time-input-box {
    background: var(--primary-light);
    border: 2px solid var(--primary-border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    position: relative;
    transition: all 0.2s ease;
  }

  .time-input-box:focus-within {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }

  .time-number-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary);
    outline: none;
  }

  .time-unit {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--primary);
    margin-left: 4px;
  }

  .package-layout {
    display: grid;
    grid-template-columns: 1fr 1fr 1.3fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  @media (max-width: 480px) {
    .package-layout {
      grid-template-columns: 1fr;
    }
  }

  .note-text {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 8px;
    text-align: right;
  }

  /* ==========================================
     7. คลาสกลางสำหรับรายการสรุป (Summary Lists)
     ========================================== */
  .summary-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .summary-label {
    font-size: 0.98rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .summary-val {
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--text-main);
    text-align: right;
    white-space: nowrap;
  }

  .summary-val.discount {
    color: #ef4444;
  }

  .summary-val.normal-dark {
    color: var(--text-main);
  }

  .summary-divider {
    border: none;
    border-top: 1px dashed var(--primary-border);
    margin: 4px 0;
  }

  .summary-row.highlight .summary-label {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-main);
    padding-top: 4px;
  }

  .summary-val.final-price {
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.2;
  }

  /* ==========================================
     8. ส่วนการชำระเงินและสินเชื่อ (Payment & Loan)
     ========================================== */
  .pay-mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .cash-info-box {
    background: var(--primary-light);
    border: 1px solid var(--primary-border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-size: 0.95rem;
    color: var(--text-main);
    line-height: 1.65;
  }

  .loan-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sub-label-title {
    display: block;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .loan-card {
    background: #fff;
    border: 1px solid var(--primary-border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.04);
  }

  .loan-card-title {
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 10px;
  }

  .loan-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .loan-field-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .loan-field-val {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .loan-result-text {
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--text-main);
    background: var(--primary-light);
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 6px;
  }

  /* ==========================================
     9. คลาสกลางยูทิลิตี้และแถบไฮไลต์ (Shared Utilities)
     ========================================== */
  .purple-unit-text {
    color: var(--primary);
    font-weight: 600;
    font-size: 0.9rem;
  }

  .purple-highlight-box {
    background: var(--primary);
    color: #fff;
    border-radius: var(--radius-md);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    gap: 8px;
  }

  .purple-highlight-label {
    font-size: 0.98rem;
    font-weight: 500;
    color: #ede9fe;
    margin-bottom: 0;
  }

  .purple-highlight-val {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
  }

  .main-header-box {
    background: var(--primary);
    color: #ffffff;
    padding: 10px;
    border-radius: var(--radius-lg);
    text-align: center;
    box-shadow: var(--shadow-card);
  }
  .main-header-title {
    font-size: 1.35rem;
    font-weight: 700;
  }

  .footer-note-box {
    font-size: 0.88rem;
    color: var(--text-muted);
    text-align: left;
    padding: 8px 4px;
    line-height: 1.65;
    width: 100%;
  }
</style>
